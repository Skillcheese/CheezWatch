<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Companion Panel</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <nav>
    <button data-tab="traffic" class="active">Traffic</button>
    <button data-tab="lab">Gauntlet Lab</button>
    <span class="spacer"></span>
    <label><input type="checkbox" id="paused"> Pause</label>
    <button id="clear">Clear</button>
  </nav>
  <main>
    <section id="traffic" class="tab active">
      <input id="filter" placeholder="Filter by URL or content…">
      <ol id="log"></ol>
    </section>
    <section id="lab" class="tab">
      <iframe src="companion://lab/index.html" title="Gauntlet Lab"></iframe>
    </section>
  </main>
  <script src="panel.js"></script>
</body>
</html>
