<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CheezWatch</title>
  <style>
    html { color-scheme: dark; }
    html.light { color-scheme: light; }
    html, body { margin: 0; height: 100%; background: #1b1f24; color: #e4e7eb; }
    html.light, html.light body { background: #f5f7fa; color: #000; }
    body { display: flex; flex-direction: column; }
    iframe { display: block; flex: 1; width: 100%; border: 0; }
    footer { padding: 4px 12px; font: 12px system-ui, sans-serif; color: #a3abb5; border-top: 1px solid #343a42; }
    footer a { color: #7aa7f0; }
    html.light footer { color: #555; border-top-color: #dde2e8; }
    html.light footer a { color: #2a5db0; }
    #feedback { max-width: 420px; width: calc(100% - 32px); font: 14px system-ui, sans-serif; }
    #feedback h2 { margin: 0 0 8px; font-size: 16px; }
    #feedback label { display: block; margin-bottom: 8px; }
    #feedback select, #feedback textarea, #feedback input { display: block; width: 100%; box-sizing: border-box; font: inherit; margin-top: 2px; }
    #feedback-count { float: right; color: #777; font-size: 12px; }
    #feedback .hp { position: absolute; left: -9999px; }
    #feedback-status { min-height: 1.2em; margin: 4px 0; }
    #feedback .buttons { text-align: right; }
  </style>
  <script>try { if (localStorage.getItem("cheezwatch-theme") === "light") document.documentElement.classList.add("light"); } catch {}</script>
  <script src="vendor/tesseract.min.js"></script>
</head>
<body>
  <iframe id="lab" src="lab/index.html" title="CheezWatch"></iframe>
  <footer>
    CheezWatch source: <a href="https://github.com/Skillcheese/CheezWatch" target="_blank" rel="noopener">github.com/Skillcheese/CheezWatch</a>
    · Built on <a href="https://github.com/amulder87/gauntlet_lab" target="_blank" rel="noopener">Gauntlet Lab</a> (AGPL-3.0)
    · Not affiliated with ScapeWatch.  </footer>
  <dialog id="feedback">
    <form method="dialog">
      <h2>Send feedback</h2>
      <label>Category
        <select name="category">
          <option value="bug">Bug</option>
          <option value="idea">Idea</option>
          <option value="other">Other</option>
        </select>
      </label>
      <label>Message <span id="feedback-count">0/2000</span>
        <textarea name="message" maxlength="2000" required rows="6"></textarea>
      </label>
      <label>Contact
        <input name="contact" maxlength="100" placeholder="Discord or email (optional)">
      </label>
      <div class="hp" aria-hidden="true"><input name="website" tabindex="-1" autocomplete="off"></div>
      <p id="feedback-status" role="status"></p>
      <div class="buttons">
        <button type="submit" formmethod="dialog" formnovalidate>Cancel</button>
        <button type="submit">Send</button>
      </div>
    </form>
  </dialog>
  <script type="module" src="app.js"></script>
  <script type="module" src="feedback.js"></script>
  <script type="module" src="theme.js"></script>
</body>
</html>
